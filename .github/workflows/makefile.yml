name: Makefile CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * 1-5"

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: download-openmpi
        run: wget https://download.open-mpi.org/release/open-mpi/v4.0/openmpi-4.0.2.tar.gz
      - name: extract-openmpi
        run: tar -xvf ./openmpi-4.0.2.tar.gz
      - name: configure-openmpi
        run: ./openmpi-4.0.2/configure
      - name: install-openmpi
        run: |
          make -j8
          sudo make install
      - name: check OpenMPI version
        run: mpiexec --version
        
      - name: check gfortran version
        run: gfortran --version

      - name: Build
        run: make
